application/icon_interpolation=4
application/file_version="1.0.0"
application/product_version="1.0.0"
application/company_name="OurWorlds"
application/product_name="OurWorlds"
application/file_description="OurWorlds — a voxel sandbox"
application/copyright="Copyright (c) 2026 The OurWorlds Authors"

