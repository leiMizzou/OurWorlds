; VoxelCraft 导出预设（Godot 4.6）。
; 实际打包需先安装匹配版本的导出模板（编辑器 -> 项目 -> 导出 -> 管理导出模板，或 godot --install-export-templates）。
; 然后：godot --headless --path . --export-release "Linux" build/linux/VoxelCraft.x86_64
;       godot --headless --path . --export-release "Windows Desktop" build/windows/VoxelCraft.exe
;       godot --headless --path . --export-release "macOS" build/macos/VoxelCraft.zip

[preset.0]

name="Linux"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="*.tgz, /tmp/*, _shot_*.png, _gallery_*.png"
export_path="build/linux/VoxelCraft.x86_64"
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"

