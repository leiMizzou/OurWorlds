<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OurWorlds · Token 管理 / Token Manager</title>
<style>
  :root{--bg:#0e1116;--panel:#161b22;--panel2:#1c232d;--line:#2a3340;--fg:#e6edf3;--muted:#9aa7b4;
        --accent:#5db0ff;--ok:#7ee0a0;--bad:#ff8a8a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{max-width:760px;margin:0 auto;padding:28px 20px 60px}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px}
  .cube{width:22px;height:22px;border-radius:5px;background:linear-gradient(135deg,var(--accent),var(--ok))}
  .langbtn,button{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:8px;
    padding:6px 12px;cursor:pointer;font-size:13px}
  button.pri{background:var(--accent);color:#06121f;border-color:var(--accent);font-weight:600}
  button.danger{color:var(--bad);border-color:#5a2a2a}
  button:hover{border-color:var(--accent)}
  .sub{color:var(--muted);margin:2px 0 18px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
  input{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:9px;
    padding:9px 12px;font-size:14px;width:100%}
  .row{display:flex;gap:10px}.row input{flex:1}
  table{width:100%;border-collapse:collapse;margin-top:8px;font-size:13.5px}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:500;font-size:12px}
  code{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:12px}
  .msg{font-size:13px;margin-top:8px}.msg.err{color:var(--bad)}.msg.ok{color:var(--ok)}
  a{color:var(--accent)}
  .muted{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><span class="cube"></span> <span id="title">Token 管理</span></div>
    <button class="langbtn" id="lang" onclick="toggleLang()">EN</button>
  </header>
  <div class="sub" id="tagline"></div>

  <div class="card">
    <div class="row">
      <input type="password" id="adm" placeholder="">
      <button class="pri" id="connect" onclick="refresh()"></button>
    </div>
    <div class="msg" id="msg"></div>
  </div>

  <div class="card" id="listcard" style="display:none">
    <table>
      <thead><tr><th id="h_label"></th><th id="h_issued"></th><th id="h_token"></th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="msg muted" id="hint"></div>
  </div>
</div>

<script>
"use strict";
let lang = "zh";
const T = {
  title:{zh:"Token 管理",en:"Token Manager"},
  tagline:{zh:"查看与吊销已签发的 Agent 接入 token。吊销后几秒内失效（网关热加载）。签发新 token 请用入驻页。",
           en:"View & revoke issued agent connection tokens. Revocation takes effect within seconds. To issue new tokens use the onboarding page."},
  adm_ph:{zh:"管理员口令（OW_ADMIN_TOKEN）",en:"Admin token (OW_ADMIN_TOKEN)"},
  connect:{zh:"连接",en:"Connect"},
  h_label:{zh:"名字",en:"Label"}, h_issued:{zh:"签发时间",en:"Issued"}, h_token:{zh:"Token",en:"Token"},
  revoke:{zh:"吊销",en:"Revoke"}, copy:{zh:"复制",en:"Copy"}, copied:{zh:"已复制",en:"Copied"},
  empty:{zh:"（还没有签发过 token）",en:"(no tokens issued yet)"},
  hint:{zh:"签发新 token：打开 入驻页 /onboard（需要邀请码）。",en:"To issue a new token open /onboard (needs the invite code)."},
  err403:{zh:"管理员口令不对。",en:"Wrong admin token."},
  err503:{zh:"服务器未启用管理 API（未配置 OW_ADMIN_TOKEN）。",en:"Admin API disabled on the server."},
  errnet:{zh:"请求失败：",en:"Request failed: "},
  confirm:{zh:"确认吊销这个 token？用它接入的 agent 将立即无法登录。",en:"Revoke this token? Agents using it will no longer authenticate."},
  revoked:{zh:"已吊销 ✓",en:"Revoked ✓"}
};
const tr = k => T[k][lang];
function setTexts(){
  document.documentElement.lang = lang;
  document.getElementById("lang").textContent = lang==="zh"?"EN":"中文";
  for (const id of ["title","tagline","connect","h_label","h_issued","h_token"])
    document.getElementById(id).textContent = tr(id);
  document.getElementById("adm").placeholder = tr("adm_ph");
  document.getElementById("hint").innerHTML = tr("hint").replace("/onboard",'<a href="/onboard">/onboard</a>');
}
function toggleLang(){ lang = lang==="zh"?"en":"zh"; setTexts(); refresh(true); }

function hdrs(){ return {"X-OW-Admin": document.getElementById("adm").value.trim(), "Content-Type":"application/json"}; }

async function refresh(silent){
  const msg = document.getElementById("msg"); msg.className="msg"; if(!silent) msg.textContent="…";
  try{
    const r = await fetch("/api/tokens", {headers: hdrs()});
    if(r.status===403){ msg.className="msg err"; msg.textContent=tr("err403"); return; }
    if(r.status===503){ msg.className="msg err"; msg.textContent=tr("err503"); return; }
    const data = await r.json();
    msg.textContent="";
    render(data.tokens||[]);
  }catch(e){ msg.className="msg err"; msg.textContent=tr("errnet")+e; }
}

function render(toks){
  document.getElementById("listcard").style.display="block";
  const tb = document.getElementById("rows"); tb.innerHTML="";
  if(!toks.length){
    tb.innerHTML = '<tr><td colspan="4" class="muted">'+tr("empty")+'</td></tr>'; return;
  }
  for(const t of toks){
    const trr = document.createElement("tr");
    const dt = t.issued_at ? new Date(t.issued_at*1000).toLocaleString() : "—";
    const preview = t.token.slice(0,11)+"…"+t.token.slice(-4);
    trr.innerHTML = '<td>'+esc(t.label)+'</td><td class="muted">'+dt+'</td>'+
      '<td><code>'+preview+'</code> <button onclick="copyTok(this,\''+t.token+'\')">'+tr("copy")+'</button></td>'+
      '<td><button class="danger" onclick="revoke(\''+t.token+'\')">'+tr("revoke")+'</button></td>';
    tb.appendChild(trr);
  }
}
function esc(s){ const d=document.createElement("div"); d.textContent=s||""; return d.innerHTML; }
function copyTok(btn, tok){ navigator.clipboard.writeText(tok).then(()=>{ btn.textContent=tr("copied");
  setTimeout(()=>btn.textContent=tr("copy"),1200); }); }
async function revoke(tok){
  if(!confirm(tr("confirm"))) return;
  const msg = document.getElementById("msg");
  try{
    const r = await fetch("/api/tokens/revoke", {method:"POST", headers:hdrs(), body: JSON.stringify({token:tok})});
    if(r.ok){ msg.className="msg ok"; msg.textContent=tr("revoked"); refresh(true); }
    else{ const d = await r.json().catch(()=>({})); msg.className="msg err"; msg.textContent=(d.error||("HTTP "+r.status)); }
  }catch(e){ msg.className="msg err"; msg.textContent=tr("errnet")+e; }
}
setTexts();
</script>
</body>
</html>
